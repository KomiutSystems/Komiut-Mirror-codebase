# Production stack for a single EC2 host. RDS (Postgres) and ElastiCache (Redis)
# are managed AWS services, NOT containers here. One brand-agnostic image runs as
# four roles: the web app (php-fpm), nginx, the queue worker, and the scheduler.
#
# `IMAGE` is set by deploy.sh to the ECR image tag being rolled out.
# App config comes from .env (populated from SSM Parameter Store on the host).
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/storage
      # Docker/prod/entrypoint.sh copies /var/www/public into here on every
      # start, so nginx (a bare image with no app code) has a document root.
      # Without this mount the entrypoint's `if [ -d /webroot ]` guard is false,
      # the copy silently no-ops, and every static file 404s in production.
      - webroot:/webroot
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - storage:/var/www/storage:ro
      # Must match `root /var/www/public` in Docker/prod/nginx.conf. Read-only:
      # only the app container publishes here.
      - webroot:/var/www/public:ro

  # ONE worker per host, and there are TWO HOSTS -- i-00d1464f6cd417378 and
  # i-04950fce92c11653c, both registered healthy in the ALB's target group, both
  # running this whole stack. So the fleet already has two workers and two
  # schedulers; this file describes one node of a pair, not the whole system.
  #
  # Whatever runs here must therefore be safe to run CONCURRENTLY with a copy of
  # itself on the other host. For the queue that is fine, checked rather than
  # assumed: it carries only SendFCMJob, SendSMSJob and DeliverSaccoAnnouncement,
  # none of which touch transactions, summaries or mpesas, and the two senders
  # declare their own guards. For the SCHEDULER it holds because
  # ->onOneServer() takes a lock in the shared cache, and cache.default is redis
  # on ElastiCache (komiut-prod-redis...), verified reachable from a running
  # container -- config/cache.php defaults to redis precisely so a deploy that
  # forgets CACHE_DRIVER fails loudly instead of quietly giving each host its own
  # lock and running every hourly command twice.
  worker:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/storage
    # Bypass the web entrypoint (which caches + runs php-fpm); run the queue.
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]

  scheduler:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage:/var/www/storage
    entrypoint: ["php", "artisan"]
    # schedule:work, NOT a `while ... sleep 60` loop.
    #
    # The loop slept 60s AFTER schedule:run returned, so every cycle was
    # (runtime + 60s) and the scheduler drifted forward by its own runtime, about
    # a wall-clock minute an hour. A task due at exactly one minute -- hourly at
    # :00, or anything ->at('03:05') -- is checked against the clock when
    # schedule:run happens to fire, so the minute it was due can fall in the gap
    # and the task simply never runs. Silently: nothing logs a task that was
    # never considered.
    #
    # schedule:work sleeps until the next minute BOUNDARY instead, so the
    # schedule stays aligned to the clock however long a run takes.
    command: ["schedule:work"]

  # Live vehicle tracking websocket server. nginx proxies /app here.
  reverb:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    entrypoint: ["php", "artisan"]
    command: ["reverb:start", "--host=0.0.0.0", "--port=8080"]
    expose:
      - "8080"

volumes:
  storage:
  # Written by the app container's entrypoint, read by nginx. Recreated on every
  # container start, so a redeploy always refreshes the published assets.
  webroot:
