version: "3.8"
services:
    #PHP Service
    nginx:
        image: nginx:alpine
        container_name: komiut-nginx
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        restart: always
        depends_on:
            - komiut-app-1
            - komiut-app-2
            - komiut-app-3
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:80" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    komiut-app-1:
        build:
            context: .
            target: php
        image: komiut
        container_name: komiut-app-1
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
    komiut-app-2:
        image: komiut
        container_name: komiut-app-2
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
    komiut-app-3:
        image: komiut
        container_name: komiut-app-3
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8000" ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
    scheduler:
        container_name: komiut_scheduler
        image: komiut
        depends_on:
            - komiut-app-1
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        working_dir: /var/www
        restart: always
        entrypoint: ["/bin/sh", "-c", "while :; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done"]
        healthcheck:
            test: ["CMD", "php", "artisan", "about"]
            interval: 60s
            timeout: 10s
            retries: 3




volumes:
    laravel-sessions:



