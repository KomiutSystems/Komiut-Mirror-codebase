version: "3.8"
services:
    #PHP Service
    php:
        build:
            context: .
            target: php
            args:
                - APP_ENV=${APP_ENV}
        environment:
            - APP_ENV=${APP_ENV}
            - CONTAINER_ROLE=app
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "8000:8000"
        depends_on:
            - database
    #Database Server
    database:
        image: mysql:latest
        ports:
            - "3306:3306"
        environment:
            - MYSQL_DATABASE=komiut
            - MYSQL_USER=komiut_user
            - MYSQL_PASSWORD=komiut@123
            - MYSQL_ALLOW_EMPTY_PASSWORD=1
            # - MYSQL_DATABASE=${DB_DATABASE}
            # - MYSQL_USER=${DB_USERNAME}
            # - MYSQL_PASSWORD=${DB_PASSWORD}
            # - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
            # - MYSQL_ALLOW_EMPTY_PASSWORD=1
        volumes:
            - db-data:/var/lib/mysql
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - 8001:80
        environment:
            - PMA_HOST=database
            - PMA_PORT=3306
volumes:
    db-data: ~
