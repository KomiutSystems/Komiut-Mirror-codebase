version: "3.8"
services:
    #PHP Service
    nginx:
        image: nginx:alpine
        container_name: komiut-nginx
        ports:
            - "80:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
            - komiut-app-1
            - komiut-app-2
            - komiut-app-3
            - komiut-app-4
            - komiut-app-5

    komiut-app-1:
        build:
            context: .
            target: php
        image: komiut
        container_name: komiut-app-1
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
    komiut-app-2:
        image: komiut
        container_name: komiut-app-2
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1
    komiut-app-3:
        image: komiut
        container_name: komiut-app-3
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1
    komiut-app-4:
        image: komiut
        container_name: komiut-app-4
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1
    komiut-app-5:
        image: komiut
        container_name: komiut-app-5
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - laravel-sessions:/var/www/storage/framework/sessions
        ports:
            - "8000"
        depends_on:
            - komiut-app-1




volumes:
    laravel-sessions:



