name: CI

# Runs the test suite on every push and pull request (all branches). No AWS
# needed — this is the gate that must be green before merging to main, where
# deploy.yml takes over.

on:
  push:
    branches-ignore: [main]   # main is covered by deploy.yml's test job
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL, not sqlite — see the note in deploy.yml. Port and credentials
    # match phpunit.xml's defaults so CI and a developer's machine agree.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: komiut_test
          POSTGRES_USER: komiut
          POSTGRES_PASSWORD: secret
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U komiut -d komiut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, bcmath, gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the test suite
        run: vendor/bin/phpunit --no-coverage
