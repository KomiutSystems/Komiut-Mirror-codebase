name: Deploy (staging -> Frankfurt prod)

# Auto-deploys the self-managed eu-central-1 (Frankfurt) box on every push to
# `staging`. Flow: run tests -> archive the repo to S3 -> tell the EC2 host (via
# SSM, no SSH keys) to pull the archive and run Docker/prod-self/deploy.sh, which
# fetches secrets from SSM, builds the image, migrates, seeds RBAC, and rolls the
# stack. The job waits for the on-box deploy and fails if it fails.
#
# GitHub Secrets required (already set):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  — IAM user komiut-ci-deploy,
#   scoped to s3:PutObject on the deploy prefix + ssm:SendCommand to the box.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  BUCKET: komiut-prod-euc1-571727472768
  INSTANCE_ID: i-0e6c889d2ccaebb34

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive the repo and upload to S3
        run: |
          git archive --format=tar.gz -o staging.tar.gz HEAD
          aws s3 cp staging.tar.gz "s3://${BUCKET}/deploy/staging.tar.gz" --region "$AWS_REGION"

      - name: Trigger deploy on the box via SSM (waits for completion)
        run: |
          CMD="export PATH=/usr/local/bin:\$PATH && cd /opt/komiut && aws s3 cp s3://${BUCKET}/deploy/staging.tar.gz /tmp/staging.tar.gz --region ${AWS_REGION} && tar xzf /tmp/staging.tar.gz -C /opt/komiut && bash Docker/prod-self/deploy.sh"
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::12}" \
            --timeout-seconds 3600 \
            --parameters commands="$CMD" \
            --query "Command.CommandId" --output text)
          echo "deploy command: $command_id"
          status=Pending
          for i in $(seq 1 120); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo Pending)
            echo "[$((i*15))s] $status"
            case "$status" in Success|Failed|Cancelled|TimedOut) break;; esac
          done
          echo "--- deploy stderr tail ---"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text | tail -c 1500 || true
          test "$status" = "Success"
