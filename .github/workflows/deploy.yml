name: Deploy (staging)

# Auto-deploys the staging box on every push to `staging`.
# Flow: test -> build arm64 image -> push to ECR -> tell the EC2 host (via SSM,
# no SSH keys) to pull the image, run migrations once, and roll the stack.
#
# ONE-TIME AWS SETUP (provisioned separately):
#   1. ECR repository `komiut` (eu-west-1).
#   2. GitHub OIDC identity provider + IAM role `komiut-github-deploy`
#      (ECR push + SSM send-command). No long-lived AWS keys in GitHub.
#   3. The EC2 instance role can pull from ECR (AmazonEC2ContainerRegistryReadOnly).
#
# Repo variables used:
#   vars.AWS_REGION, vars.AWS_ROLE_ARN, vars.ECR_REPOSITORY (=komiut),
#   vars.EC2_INSTANCE_ID

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  id-token: write   # for OIDC
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, bcmath, gd, zip
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run the test suite
        run: vendor/bin/phpunit --no-coverage

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (arm64 / Graviton)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Pull config from git (compose/nginx/deploy.sh), then hand off to the
      # on-box script which pulls the ECR image, migrates once, and rolls services.
      - name: Trigger deploy on EC2 via SSM
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          cmd="cd /opt/komiut && git fetch --quiet origin staging && git reset --hard origin/staging && AWS_REGION=${{ vars.AWS_REGION }} IMAGE=$IMAGE bash Docker/staging/deploy.sh"
          command_id=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA::12} to staging" \
            --timeout-seconds 3600 \
            --parameters commands="$cmd" \
            --query "Command.CommandId" --output text)
          echo "Deploy command: $command_id"
          status=Pending
          for i in $(seq 1 80); do
            sleep 15
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query "Status" --output text 2>/dev/null || echo Pending)
            echo "[$((i*15))s] $status"
            if [ "$status" = "Success" ] || [ "$status" = "Failed" ] || [ "$status" = "Cancelled" ] || [ "$status" = "TimedOut" ]; then
              break
            fi
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" --output json
          test "$status" = "Success"
