name: Deploy (staging -> Frankfurt prod)

# Auto-deploys the eu-central-1 (Frankfurt) production fleet on every push to
# `staging`.
#
# Flow: run tests -> build the API image and push it to ECR -> run migrations
# ONCE -> roll every app instance to the new image via SSM (no SSH keys).
#
# This replaced a build-on-the-box deploy. Two reasons it had to change:
#
#  1. The fleet is now an Auto Scaling Group behind an ALB, not one box, so the
#     deploy targets instances BY TAG. A hardcoded instance id would deploy to a
#     machine the ASG may have already replaced.
#  2. Postgres and Redis are now RDS and ElastiCache, not containers on the host.
#     docker-compose.prod.yml therefore only PULLS an image -- it has no build
#     section -- so the image must exist in ECR before a deploy can roll.
#
# NOTE the two ECR repositories: `komiut-api` is THIS Laravel service.
# `komiut-web` is the separate Next.js frontend. They are not interchangeable;
# pointing the API fleet at the web image yields `exec: "php": not found`.
#
# GitHub Secrets required: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   (IAM user komiut-ci-deploy: ecr push, ssm:SendCommand to the tagged fleet)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  ECR_REPO: komiut-api
  ACCOUNT: "571727472768"
  ASG_NAME: komiut-prod-asg
  INSTANCE_TAG: komiut-prod-app
  BUCKET: komiut-prod-euc1-571727472768
  # Public hostname the ALB serves. Used by the post-deploy smoke test.
  PUBLIC_HOST: api.komiut.com

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL, because staging and production run PostgreSQL and sqlite cannot
    # fail the way they fail. Port/credentials match phpunit.xml's defaults.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: komiut_test
          POSTGRES_USER: komiut
          POSTGRES_PASSWORD: secret
        ports:
          - 54321:5432
        options: >-
          --health-cmd "pg_isready -U komiut -d komiut_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, bcmath, gd, zip, pcntl
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # REQUIRED for the layer cache below. The runner's default buildx driver is
      # `docker`, which cannot export a cache -- the build fails outright with
      # "Cache export is not supported for the docker driver." This action swaps in
      # the `docker-container` driver, which can. It is also what makes
      # multi-platform builds possible, if an arm64 image is ever wanted (a t4g
      # fleet is ~20% cheaper for the same work).
      - uses: docker/setup-buildx-action@v3

      - name: Compute the image tag
        id: meta
        run: |
          REG="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"
          echo "image=${REG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "registry=${REG}" >> "$GITHUB_OUTPUT"

      # linux/amd64 explicitly. The fleet runs x86_64 instances; a single-arch
      # arm64 image would start and then die with `exec: "php": not found`,
      # which reads like a broken image rather than an architecture mismatch.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.registry }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Required: this job runs .github/scripts/await-ssm.sh. Without a checkout
      # the script simply is not on the runner and every step that calls it dies
      # with exit 127 (command not found) — which reads like an AWS failure
      # rather than a missing file.
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The image carries the app code; /opt/komiut on each host carries the
      # RUNTIME config — docker-compose.prod.yml and Docker/prod/*. Two separate
      # paths read that directory and BOTH were stale:
      #
      #   - the launch template's user-data pulls deploy/api-src.tar.gz at boot,
      #     and nothing had rewritten that object since 2026-08-07;
      #   - the deploy rolled containers but never refreshed /opt/komiut at all.
      #
      # So every compose/nginx change committed here stayed on the branch. That
      # is how nginx ended up with no document root and every static asset (the
      # whole /docs reference) 404ing while the deploy still reported green.
      #
      # Publishing to the SAME object name user-data already fetches keeps one
      # artifact feeding both paths — no launch-template change needed.
      - name: Publish the runtime source archive to S3
        run: |
          git archive --format=tar.gz -o api-src.tar.gz HEAD
          aws s3 cp api-src.tar.gz "s3://${BUCKET}/deploy/api-src.tar.gz" --region "$AWS_REGION"

      - name: Resolve the fleet
        id: fleet
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
                  --auto-scaling-group-names "$ASG_NAME" \
                  --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
                  --output text)
          [ -n "$IDS" ] || { echo "No InService instances in $ASG_NAME"; exit 1; }
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "first=$(echo $IDS | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "Fleet: $IDS"

      # ONE instance, ONE time. Running this per-instance would have several
      # nodes racing the same schema change; Laravel's migration table would
      # mostly serialise them, but "mostly" is not a guarantee worth taking on a
      # payments schema.
      - name: Migrate (once)
        id: migrate
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids "${{ steps.fleet.outputs.first }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters "commands=[\"set -eux\",\"cd /opt/komiut\",\"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com\",\"IMAGE=${{ needs.build.outputs.image }} docker compose -f docker-compose.prod.yml run --rm --entrypoint php app artisan migrate --force\"]" \
            --query Command.CommandId --output text)
          bash .github/scripts/await-ssm.sh "$CMD" "${{ steps.fleet.outputs.first }}"

      # The webroot volume is torn down and recreated on every roll, deliberately.
      # It holds no durable state — it is a publish target that entrypoint.sh
      # refills from the image on each start — so recreating it guarantees the
      # served assets always match the image that is running, and removes the
      # staleness trap where a volume created once keeps serving old files
      # forever because Docker only seeds a volume when it is empty.
      #
      # It also repairs the first attempt at this: that volume was created for a
      # path absent from the image, so Docker made it root:root while the app
      # container runs as www-data. Recreating it against an image that now ships
      # /webroot owned by www-data is what actually lets the publish succeed.
      # Rolls ONE instance at a time, and takes each one OUT of the load
      # balancer before touching it.
      #
      # Without the deregister, `docker compose rm -sf app nginx` kills nginx on
      # a box the ALB is still routing to, so every request that lands there
      # during the pull-restart-boot window is a 502. That is what fired
      # komiut-prod-5xx twice on 2026-08-30 (14 errors at 09:02, 13 at 09:38) --
      # both spikes are deploys, not application faults.
      # `docker image prune -f` only clears DANGLING layers, and a tagged
      # release image is never dangling — so every deploy left one behind for
      # good. Eight deploys in a day put 45 images and 5.5 GB on each node
      # (28% of a 30 GB disk) before anyone looked. The second prune drops
      # unused release images older than 72h, which keeps three days of them
      # for a fast local rollback; anything older is still in ECR and one pull
      # away.
      - name: Roll every instance onto the new image
        run: |
          TG=$(aws elbv2 describe-target-groups --names komiut-prod-tg --query "TargetGroups[0].TargetGroupArn" --output text)
          FLEET=(${{ steps.fleet.outputs.ids }})
          echo "fleet size: ${#FLEET[@]}"

          target_state() {
            aws elbv2 describe-target-health --target-group-arn "$TG" --targets "Id=$1" --query "TargetHealthDescriptions[0].TargetHealth.State" --output text 2>/dev/null || echo gone
          }

          for id in "${FLEET[@]}"; do
            echo "=== rolling $id ==="

            if [ "${#FLEET[@]}" -gt 1 ]; then
              echo "  draining $id out of the load balancer"
              aws elbv2 deregister-targets --target-group-arn "$TG" --targets "Id=$id"
              for i in $(seq 1 24); do
                STATE=$(target_state "$id")
                echo "    state=$STATE"
                case "$STATE" in
                  unused|gone|None|"") break ;;
                esac
                sleep 5
              done
            else
              echo "  single-instance fleet: cannot drain, a brief 5xx is unavoidable"
            fi
            CMD=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 900 \
              --parameters "commands=[\"set -eux\",\"cd /opt/komiut\",\"aws s3 cp s3://${BUCKET}/deploy/api-src.tar.gz /tmp/api-src.tar.gz --region $AWS_REGION\",\"tar xzf /tmp/api-src.tar.gz -C /opt/komiut\",\"bash Docker/prod/render-env.sh $AWS_REGION /opt/komiut/.env\",\"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com\",\"export IMAGE=${{ needs.build.outputs.image }}\",\"docker compose -f docker-compose.prod.yml pull\",\"docker compose -f docker-compose.prod.yml rm -sf app nginx\",\"docker volume rm komiut_webroot || true\",\"docker compose -f docker-compose.prod.yml up -d --remove-orphans\",\"docker image prune -f\",\"docker image prune -af --filter until=72h\"]" \
              --query Command.CommandId --output text)
            bash .github/scripts/await-ssm.sh "$CMD" "$id"

            if [ "${#FLEET[@]}" -gt 1 ]; then
              echo "  putting $id back in the load balancer"
              aws elbv2 register-targets --target-group-arn "$TG" --targets "Id=$id"
              # It must be serving again BEFORE the next instance drains, or the
              # fleet is briefly empty and we recreate the outage this fixes.
              for i in $(seq 1 40); do
                STATE=$(target_state "$id")
                echo "    state=$STATE"
                [ "$STATE" = "healthy" ] && break
                sleep 5
              done
              if [ "$(target_state "$id")" != "healthy" ]; then
                echo "  $id did not come back healthy -- stopping before draining the next one"
                exit 1
              fi
            fi
          done

      # The deploy is not done when the containers start — it is done when the
      # load balancer agrees. Without this a broken image reports a green deploy.
      - name: Wait for every target to be healthy
        run: |
          TG=$(aws elbv2 describe-target-groups --names komiut-prod-tg \
                --query "TargetGroups[0].TargetGroupArn" --output text)
          for i in $(seq 1 40); do
            BAD=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
                    --query "length(TargetHealthDescriptions[?TargetHealth.State!='healthy'])" --output text)
            TOTAL=$(aws elbv2 describe-target-health --target-group-arn "$TG" \
                    --query "length(TargetHealthDescriptions)" --output text)
            echo "unhealthy=$BAD of $TOTAL"
            [ "$BAD" = "0" ] && [ "$TOTAL" != "0" ] && { echo "All targets healthy"; exit 0; }
            sleep 15
          done
          aws elbv2 describe-target-health --target-group-arn "$TG" \
            --query "TargetHealthDescriptions[].{Id:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason}" --output table
          echo "Targets did not become healthy"
          exit 1

      # A green target group only proves the health-check path answers. It said
      # everything was fine for over a week while nginx had no document root and
      # every static asset 404'd. Assert the things a browser and the mobile apps
      # actually request, so that class of failure fails the deploy instead of
      # being discovered by hand.
      - name: Smoke-test the public surface
        run: |
          fail=0
          check() { # name, url, expected-code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$2" || echo 000)
            if [ "$code" = "$3" ]; then
              echo "  ok    $1 -> $code"
            else
              echo "  FAIL  $1 -> $code (expected $3)"
              fail=1
            fi
          }
          # Static assets, served by nginx from the published web root.
          check "API reference (/docs)"  "https://${PUBLIC_HOST}/docs/"             200
          check "OpenAPI spec"           "https://${PUBLIC_HOST}/docs/openapi.yaml" 200
          # One real request through the whole stack: nginx -> php-fpm -> brand
          # resolution (by Host, no X-App-Key) -> router -> database. Deliberately
          # a pre-authentication public route, so no credentials live in CI.
          check "public API route"       "https://${PUBLIC_HOST}/api/v1/auth/saccos/directory" 200
          exit $fail

      # WHAT STATE IS PROD IN? Runs only when something above failed.
      #
      # Nothing here rolls anything back, deliberately. By the time most
      # failures happen the migration has already run, and re-rolling the old
      # image would not undo it -- on a destructive migration that turns a bad
      # deploy into a worse one. So this answers the question a red X does not:
      # which boxes took the new image, which are serving, and did the schema
      # move.
      #
      # The three states worth naming, because recovery differs for each:
      #   migrate ran, nothing rolled     -> new schema, ALL old code
      #   migrate ran, some rolled        -> mixed fleet on a new schema
      #   all rolled, smoke test failed   -> the new code IS live and serving
      #
      # Old code on a new schema is only safe while migrations stay additive
      # (expand now, contract in a later release). That property is what makes
      # this a report rather than an incident.
      - name: On failure, report what actually landed
        if: failure()
        run: |
          echo "intended image : ${{ needs.build.outputs.image }}"
          echo "migrate step   : ${{ steps.migrate.outcome }}"
          case "${{ steps.migrate.outcome }}" in
            success) echo "  -> THE SCHEMA HAS MOVED. Old code must tolerate it." ;;
            failure) echo "  -> migration FAILED; schema may be partially applied." ;;
            *)       echo "  -> migration never ran; schema is unchanged." ;;
          esac

          echo ""
          echo "--- image running on each instance ---"
          IDS=$(aws autoscaling describe-auto-scaling-groups --auto-scaling-group-names "$ASG_NAME" --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" --output text || true)
          PROBE='docker inspect --format={{.Config.Image}} $(docker compose -f /opt/komiut/docker-compose.prod.yml ps -q app | head -1)'
          for id in $IDS; do
            CMD=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript --timeout-seconds 120 --parameters commands="[\"$PROBE\"]" --query Command.CommandId --output text 2>/dev/null || true)
            if [ -z "$CMD" ]; then
              echo "  $id: could not query"
              continue
            fi
            for i in $(seq 1 20); do
              ST=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" --query Status --output text 2>/dev/null || echo Pending)
              case "$ST" in Success|Failed|TimedOut|Cancelled) break ;; esac
              sleep 3
            done
            OUT=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$id" --query StandardOutputContent --output text 2>/dev/null || true)
            echo "  $id: ${OUT:-unknown}"
          done

          echo ""
          echo "--- load balancer view (who is actually serving) ---"
          TG=$(aws elbv2 describe-target-groups --names komiut-prod-tg --query "TargetGroups[0].TargetGroupArn" --output text 2>/dev/null || true)
          if [ -n "$TG" ]; then
            aws elbv2 describe-target-health --target-group-arn "$TG" --query "TargetHealthDescriptions[].{Id:Target.Id,State:TargetHealth.State,Reason:TargetHealth.Reason}" --output table || true
          else
            echo "  target group not resolvable"
          fi

          echo ""
          echo "An instance left deregistered is NOT restored automatically:"
          echo "  aws elbv2 register-targets --target-group-arn <tg> --targets Id=<instance>"
