name: 'Payments — M-Pesa STK'
description: |-

  The passenger app initiates an STK push, then polls this for the outcome and
  can cancel a push the user abandoned. Status is read from local state only:
  the confirmation webhook lands within seconds in the normal case, and the
  `payments:reconcile` poller recovers the rare lost callback — so this endpoint
  never calls Safaricom and never writes to a booking, keeping it fast and
  incapable of the "notification/query rolled back a paid booking" failure mode.

  Status vocabulary matches the app's model: processing | completed | failed |
  cancelled | not_found, with resultCode (0 paid, 1 failed/cancelled, null
  pending) and mpesaReceiptNumber once completed.
endpoints:
  -
    custom: []
    httpMethods:
      - GET
    uri: 'api/v1/auth/mpesa/stk/status/{checkout}'
    metadata:
      custom: []
      groupName: 'Payments — M-Pesa STK'
      groupDescription: |-

        The passenger app initiates an STK push, then polls this for the outcome and
        can cancel a push the user abandoned. Status is read from local state only:
        the confirmation webhook lands within seconds in the normal case, and the
        `payments:reconcile` poller recovers the rare lost callback — so this endpoint
        never calls Safaricom and never writes to a booking, keeping it fast and
        incapable of the "notification/query rolled back a paid booking" failure mode.

        Status vocabulary matches the app's model: processing | completed | failed |
        cancelled | not_found, with resultCode (0 paid, 1 failed/cancelled, null
        pending) and mpesaReceiptNumber once completed.
      subgroup: ''
      subgroupDescription: ''
      title: "Poll an STK payment's status"
      description: ''
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      checkout:
        custom: []
        name: checkout
        description: 'The CheckoutRequestID from the push.'
        required: true
        example: ws_CO_28062026...
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      checkout: ws_CO_28062026...
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status": "completed", "resultCode": 0, "mpesaReceiptNumber": "SFT12ABC34"}'
        headers: []
        description: ''
      -
        custom: []
        status: 200
        content: '{"status": "not_found", "resultCode": null}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/auth/mpesa/stk/cancel/{checkout}'
    metadata:
      custom: []
      groupName: 'Payments — M-Pesa STK'
      groupDescription: |-

        The passenger app initiates an STK push, then polls this for the outcome and
        can cancel a push the user abandoned. Status is read from local state only:
        the confirmation webhook lands within seconds in the normal case, and the
        `payments:reconcile` poller recovers the rare lost callback — so this endpoint
        never calls Safaricom and never writes to a booking, keeping it fast and
        incapable of the "notification/query rolled back a paid booking" failure mode.

        Status vocabulary matches the app's model: processing | completed | failed |
        cancelled | not_found, with resultCode (0 paid, 1 failed/cancelled, null
        pending) and mpesaReceiptNumber once completed.
      subgroup: ''
      subgroupDescription: ''
      title: 'Cancel a pending STK push'
      description: |-
        Records that the user backed out before entering their PIN. Local intent
        only — Safaricom has no cancel API — so if the payment nonetheless
        completes, the reconciler still confirms it (paid always wins over cancel).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      checkout:
        custom: []
        name: checkout
        description: ''
        required: true
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      checkout: architecto
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"status": "cancelled"}'
        headers: []
        description: ''
      -
        custom: []
        status: 409
        content: '{"error": "This payment is already settled."}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
