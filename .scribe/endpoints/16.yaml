name: Profile
description: |-

  Self-service profile edits for the authenticated account. This is the remote
  save the mobile edit-profile screen needs: today the app persists name and
  phone to the device only, so those changes never reach the backend.

  Every field is optional — the client sends just what changed. The account is
  always the token holder; there is no id in the body to tamper with.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/profile/update
    metadata:
      custom: []
      groupName: Profile
      groupDescription: |-

        Self-service profile edits for the authenticated account. This is the remote
        save the mobile edit-profile screen needs: today the app persists name and
        phone to the device only, so those changes never reach the backend.

        Every field is optional — the client sends just what changed. The account is
        always the token holder; there is no id in the body to tamper with.
      subgroup: ''
      subgroupDescription: ''
      title: 'Update my profile'
      description: |-
        Sets any of the caller's own name or phone. A passenger who signed in with
        Google arrives with no phone; this is where they add it. Phone must be
        unique — it is the account's payment identity for M-Pesa.

        NOTE: the phone is not verified here. A typo sends a future STK push to a
        stranger, so an OTP step should gate this before live payments — kept out
        for now to match the app, which has no verification screen yet.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      firstname:
        custom: []
        name: firstname
        description: 'The given name.'
        required: false
        example: John
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      lastname:
        custom: []
        name: lastname
        description: 'The family name.'
        required: false
        example: Mwangi
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      phone:
        custom: []
        name: phone
        description: '10-digit Kenyan mobile, unique.'
        required: false
        example: '0712345678'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      firstname: John
      lastname: Mwangi
      phone: '0712345678'
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": "Profile updated", "user": {"id": 1, "firstname": "John", "phone": "0712345678"}}'
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: '{"errors": {"phone": ["That phone number is already in use."]}}'
        headers: []
        description: ''
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
