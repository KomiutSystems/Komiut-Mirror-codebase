name: 'QR-code fare payment'
description: |-

  Pay a matatu by scanning its printed QR. The QR holds a tamper-proof SIGNED
  token (see QrTokenService) that encodes only the vehicle identity — never the
  amount, because fares vary. Flow: the SACCO/driver generates the token
  (vehicle/{id}/token), the passenger scans and resolves it (qrcode/resolve),
  then pays the resolved vehicle's till via the QR STK push (qrcode/stk/push)
  with a passenger-entered amount.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/auth/qrcode/stk/push
    metadata:
      custom: []
      groupName: 'QR-code fare payment'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'QR STK push (pay a scanned matatu)'
      description: |-
        Charges the passenger-entered amount to the vehicle's till via M-Pesa STK.
        Prefer `qr_token` from a scanned QR (tamper-proof); `vehicle_id` is accepted
        for legacy callers. The amount is client-supplied because fares vary. A
        lost/delayed callback is recovered by the `payments:reconcile` poller.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      vehicle_id:
        custom: []
        name: vehicle_id
        description: 'required_without:qr_token The vehicle id (legacy).'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      amount:
        custom: []
        name: amount
        description: 'Amount in KES the passenger pays.'
        required: true
        example: 120
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      phone:
        custom: []
        name: phone
        description: '10-digit M-Pesa phone.'
        required: true
        example: '0700111222'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      seat_id:
        custom: []
        name: seat_id
        description: 'Must match an existing stored value.'
        required: false
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      user_id:
        custom: []
        name: user_id
        description: 'Must match an existing stored value.'
        required: false
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      qr_token:
        custom: []
        name: qr_token
        description: 'The signed token from a scanned QR (preferred).'
        required: false
        example: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      vehicle_id: 1
      amount: 120
      phone: '0700111222'
      seat_id: 16
      user_id: 16
      qr_token: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
    fileParameters: []
    responses:
      -
        custom: []
        status: 404
        content: |-
          {
              "message": ""
          }
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-ratelimit-limit: '60'
          x-ratelimit-remaining: '59'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
