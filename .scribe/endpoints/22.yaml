name: 'Partner bank — writing back'
description: |-

  The other half of the loop. Until now the partner portal was read-only: NCBA
  pulled a lead list and whatever happened next happened in their systems,
  invisible to us. These two endpoints let them tell us the outcome — an
  account was opened, and here are the till credentials we asked for.

  A write endpoint on a shared-key portal is a different risk from a read one.
  A leaked key used to leak a lead list; now it could inject money-routing
  values. Hence the hard rule below, which is not negotiable:

    THE PARTNER NEVER WRITES A VEHICLE'S till_number OR merchant_short_code.

  KDY 599G is the argument. Its merchant_short_code was wrong for a month; its
  collections were invisible the entire time and the record looked perfectly
  healthy — only the ABSENCE of payments gave it away. Tills the bank issues
  land on the request as `issued_tills` and a human applies them from the
  dashboard. tills:check-idle is the backstop, not the gate.

  Everything here is idempotent (banks retry), takes its brand from the partner
  key rather than the body, and is audited: this is a third party changing our
  records, so "who changed what, when" must be answerable later.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/partner/bank/leads/{lead}/account'
    metadata:
      custom: []
      groupName: 'Partner bank — writing back'
      groupDescription: |-

        The other half of the loop. Until now the partner portal was read-only: NCBA
        pulled a lead list and whatever happened next happened in their systems,
        invisible to us. These two endpoints let them tell us the outcome — an
        account was opened, and here are the till credentials we asked for.

        A write endpoint on a shared-key portal is a different risk from a read one.
        A leaked key used to leak a lead list; now it could inject money-routing
        values. Hence the hard rule below, which is not negotiable:

          THE PARTNER NEVER WRITES A VEHICLE'S till_number OR merchant_short_code.

        KDY 599G is the argument. Its merchant_short_code was wrong for a month; its
        collections were invisible the entire time and the record looked perfectly
        healthy — only the ABSENCE of payments gave it away. Tills the bank issues
        land on the request as `issued_tills` and a human applies them from the
        dashboard. tills:check-idle is the backstop, not the gate.

        Everything here is idempotent (banks retry), takes its brand from the partner
        key rather than the body, and is audited: this is a third party changing our
        records, so "who changed what, when" must be answerable later.
      subgroup: ''
      subgroupDescription: ''
      title: "Confirm a driver's account was opened"
      description: |-
        Idempotent: a retry with the same account number is accepted and changes
        nothing, so a bank that did not see our 200 can safely send it again.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      lead:
        custom: []
        name: lead
        description: 'The lead.'
        required: true
        example: '564'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      lead: '564'
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      account_number:
        custom: []
        name: account_number
        description: 'Must not be greater than 40 characters.'
        required: true
        example: b
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      opened_at:
        custom: []
        name: opened_at
        description: 'Must be a valid date.'
        required: false
        example: '2026-08-15T12:18:18'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
    cleanBodyParameters:
      account_number: b
      opened_at: '2026-08-15T12:18:18'
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"error":"A partner key is required."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-ratelimit-limit: '30'
          x-ratelimit-remaining: '27'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/v1/partner/bank/till-requests/{tillRequest}/credentials'
    metadata:
      custom: []
      groupName: 'Partner bank — writing back'
      groupDescription: |-

        The other half of the loop. Until now the partner portal was read-only: NCBA
        pulled a lead list and whatever happened next happened in their systems,
        invisible to us. These two endpoints let them tell us the outcome — an
        account was opened, and here are the till credentials we asked for.

        A write endpoint on a shared-key portal is a different risk from a read one.
        A leaked key used to leak a lead list; now it could inject money-routing
        values. Hence the hard rule below, which is not negotiable:

          THE PARTNER NEVER WRITES A VEHICLE'S till_number OR merchant_short_code.

        KDY 599G is the argument. Its merchant_short_code was wrong for a month; its
        collections were invisible the entire time and the record looked perfectly
        healthy — only the ABSENCE of payments gave it away. Tills the bank issues
        land on the request as `issued_tills` and a human applies them from the
        dashboard. tills:check-idle is the backstop, not the gate.

        Everything here is idempotent (banks retry), takes its brand from the partner
        key rather than the body, and is audited: this is a third party changing our
        records, so "who changed what, when" must be answerable later.
      subgroup: ''
      subgroupDescription: ''
      title: 'Return the credentials for a till request'
      description: |-
        The reply to the push-notification letter: the username, password and
        secret key the callback will authenticate with, plus the tills the bank
        actually opened.

        The tills are STAGED, not applied. See the class docblock.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_SANCTUM_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      tillRequest:
        custom: []
        name: tillRequest
        description: ''
        required: true
        example: '564'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      tillRequest: '564'
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      username:
        custom: []
        name: username
        description: 'Must not be greater than 120 characters.'
        required: true
        example: b
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      password:
        custom: []
        name: password
        description: 'Must not be greater than 255 characters.'
        required: true
        example: ']|{+-0pBNvYg'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      secret_key:
        custom: []
        name: secret_key
        description: 'Must not be greater than 255 characters.'
        required: true
        example: h
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      issued_tills:
        custom: []
        name: issued_tills
        description: 'Must not have more than 200 items.'
        required: false
        example: null
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      'issued_tills[].plate':
        custom: []
        name: 'issued_tills[].plate'
        description: 'This field is required when <code>issued_tills</code> is present. Must not be greater than 20 characters.'
        required: false
        example: waykcmyuwpwlvqwr
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'issued_tills[].till':
        custom: []
        name: 'issued_tills[].till'
        description: 'This field is required when <code>issued_tills</code> is present. Must not be greater than 20 characters.'
        required: false
        example: sitcpscqldzsnrwt
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      username: b
      password: ']|{+-0pBNvYg'
      secret_key: h
      issued_tills:
        -
          plate: waykcmyuwpwlvqwr
          till: sitcpscqldzsnrwt
    fileParameters: []
    responses:
      -
        custom: []
        status: 401
        content: '{"error":"A partner key is required."}'
        headers:
          cache-control: 'no-cache, private'
          content-type: application/json
          x-ratelimit-limit: '30'
          x-ratelimit-remaining: '26'
          access-control-allow-origin: '*'
        description: null
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
