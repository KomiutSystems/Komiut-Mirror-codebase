events {}

http {
    upstream komiut_app {
        server komiut-app-1:8000;
        server komiut-app-2:8000;

    }
    upstream 2safiri_app {
            server 2safiri-app-1:8000;
            server 2safiri-app-2:8000;

        }

 # Route for komiut.com
    server {
        listen 80;
        server_name komiut.com www.komiut.com;
        location / {
            proxy_pass         http://komiut_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
        }
    }

    # Route for 2safiri.com
    server {
        listen 80;
        server_name 2safiri.com www.2safiri.com;

        location / {
            proxy_pass         http://2safiri_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
        }

    }
}
