                      paid: true
                      seats:
                        - 4
                      pickup:
                        id: 12
                        name: Ruiru
                      dropoff:
                        id: 18
                        name: Thika
                  pickups:
                    -
                      place_id: 12
                      name: Ruiru
                      passengers: 1
                  dropoffs:
                    -
                      place_id: 18
                      name: Thika
                      passengers: 1
                properties:
