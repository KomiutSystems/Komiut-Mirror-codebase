  /api/v1/auth/book_a_ride/location:
    post:
      summary: "Broadcast the driver's position"
      operationId: broadcastTheDriversPosition
      description: "The driver app calls this every few seconds while on a trip. It updates the\nlive index and pushes a `vehicle.moved` event over Reverb on the trip's\nprivate channel, so every passenger who booked this queue sees the vehicle\nmove in real time. Only the vehicle's crew/owner may broadcast for it."
      parameters: []
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: broadcasting
                  heading: 74
                properties:
                  status:
                    type: string
                    example: broadcasting
                  heading:
                    type: integer
                    example: 74
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'You do not crew this vehicle.'
                properties:
                  error:
                    type: string
                    example: 'You do not crew this vehicle.'
      tags:
        - 'Live tracking'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queue_id:
                  type: integer
                  description: 'The active trip (queue) id.'
                  example: 7
                latitude:
                  type: number
                  description: 'Current latitude.'
                  example: -1.2833
                longitude:
                  type: number
                  description: 'Current longitude.'
                  example: 36.8167
              required:
                - queue_id
                - latitude
                - longitude
  /api/v1/auth/book_a_ride/location/stop:
    post:
      summary: 'Stop broadcasting'
      operationId: stopBroadcasting
      description: 'Called when the trip ends — the vehicle drops off the live map.'
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
