  '/api/v1/auth/qrcode/vehicle/{vehicle_id}/token':
    get:
      summary: "Generate a vehicle's fare QR token"
      operationId: generateAVehiclesFareQRToken
      description: "Returns a tamper-proof signed token for the vehicle; the dashboard/app\nrenders a QR from it and displays it in the matatu. Never expires; encodes\nonly the vehicle identity, never an amount."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
                  vehicle:
                    id: 1
                    plate: KDA123X
                    till_number: '5202020'
                properties:
                  token:
                    type: string
                    example: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
                  vehicle:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      plate:
                        type: string
                        example: KDA123X
                      till_number:
                        type: string
                        example: '5202020'
