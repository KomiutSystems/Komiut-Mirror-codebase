openapi: 3.0.3
info:
  title: 'Komiut / 2Safiri Matatu API'
  description: 'REST API for the Komiut / 2Safiri matatu SACCO platform: authentication, vehicles, routes, queues, bookings, transactions, saccos, users and loyalty points.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a bearer token from the <code>POST api/login</code> or <code>POST api/register</code> endpoints. All requests must also send the <code>X-App-Key</code> brand header.'
security:
  -
    default: []
paths:
  /api/v1/auth/qrcode/stk/push:
    post:
      summary: ''
      operationId: postApiV1AuthQrcodeStkPush
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                amount:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                phone:
                  type: string
                  description: 'Must be 10 digits.'
                  example: '8225697751'
                seat_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                user_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
              required:
                - vehicle_id
                - amount
                - phone
