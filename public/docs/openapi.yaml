openapi: 3.0.3
info:
  title: 'Komiut / 2Safiri Matatu API'
  description: 'REST API for the Komiut / 2Safiri matatu SACCO platform: authentication, vehicles, routes, queues, bookings, transactions, saccos, users and loyalty points.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Billing administration'
    description: "\nSuperadmin-only management of billing plans, SACCO subscriptions and invoice\ngeneration. Rates and assignments are controlled here; SACCOs only read their\nown billing (see the \"SACCO billing\" group)."
  -
    name: 'Book a ride'
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: 'Live tracking'
    description: ''
  -
    name: Loyalty
    description: ''
  -
    name: 'Password reset (email)'
    description: "\nEmail-based password reset for dashboard accounts (SACCO admins & staff).\nStandard token flow: request a link → email → set a new password with the token.\nThe email links to the frontend reset page (App\\Notifications\\ResetPasswordLink).\nPassengers on the mobile app reset via phone/SMS instead — see /reset_password."
  -
    name: 'QR-code fare payment'
    description: "\nPay a matatu by scanning its printed QR. The QR holds a tamper-proof SIGNED\ntoken (see QrTokenService) that encodes only the vehicle identity — never the\namount, because fares vary. Flow: the SACCO/driver generates the token\n(vehicle/{id}/token), the passenger scans and resolves it (qrcode/resolve),\nthen pays the resolved vehicle's till via the QR STK push (qrcode/stk/push)\nwith a passenger-entered amount."
  -
    name: 'Roles & permissions'
    description: "\nThe dashboard renders per-permission — the login response already returns the\nsigned-in user's `permissions`, and the UI shows/hides modules off that.\n\nRoles are global (no per-SACCO custom roles yet), so **role CRUD is\nsuperadmin-only**: a created role would otherwise be visible to every SACCO.\nSACCO admins get an **assign-only** surface — they may place their own staff\non the shared SACCO-tier roles, and only on roles whose permissions they\nthemselves hold."
  -
    name: 'SACCO billing'
    description: "\nA SACCO's own subscription and invoices. Every read is SACCO-scoped\nautomatically (a SACCO can never see another SACCO's billing); superadmins\nsee across SACCOs and may target one with `sacco_id`. Invoices are settled by\npaying the `invoice_number` as the M-Pesa account reference to the billing\npaybill — management (rates, generation) lives in the superadmin billing API."
  -
    name: 'SACCO fares'
    description: "\nSACCOs price their own routes. A fare is per pickup→dropoff pair; where no\npair is set, the flat `sacco_routes.amount` applies. Editing here invalidates\nthe fare cache so the new price is live immediately."
  -
    name: 'SACCO loyalty'
    description: "\nA SACCO configures its own loyalty program: the earn divisor (KES per point)\nand the points needed for a free ride."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a bearer token from the <code>POST api/login</code> or <code>POST api/register</code> endpoints. All requests must also send the <code>X-App-Key</code> brand header.'
security:
  -
    default: []
paths:
  /api/v1/auth/billing/plans:
    get:
      summary: 'List billing plans'
      operationId: listBillingPlans
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
  /api/v1/auth/billing/plans/save:
    post:
      summary: 'Create or update a billing plan'
      operationId: createOrUpdateABillingPlan
      description: "Pass `id` to update an existing plan, omit it to create one. Invoice for a\nperiod = base_fee + per_vehicle_fee × active vehicles (capped at vehicle_cap)."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'Plan id to update; omit to create.'
                  example: 1
                  nullable: true
                name:
                  type: string
                  description: 'Plan name.'
                  example: Standard
                description:
                  type: string
                  description: 'Short description.'
                  example: 'Up to 50 vehicles'
                  nullable: true
                billing_cycle:
                  type: string
                  description: 'monthly, quarterly or annually.'
                  example: monthly
                base_fee:
                  type: number
                  description: 'Flat fee per period in KES.'
                  example: 500.0
                  nullable: true
                per_vehicle_fee:
                  type: number
                  description: 'Fee per active vehicle in KES.'
                  example: 100.0
                  nullable: true
                vehicle_cap:
                  type: integer
                  description: 'Stop charging past this many vehicles.'
                  example: 50
                  nullable: true
                currency:
                  type: string
                  description: '3-letter currency code.'
                  example: KES
                  nullable: true
                is_active:
                  type: boolean
                  description: 'Whether the plan can be assigned.'
                  example: true
                  nullable: true
              required:
                - name
                - billing_cycle
  /api/v1/auth/billing/subscriptions/assign:
    post:
      summary: 'Assign a SACCO to a plan'
      operationId: assignASACCOToAPlan
      description: "Creates or updates the SACCO's subscription and sets the first billing\ndate (defaults to today). One subscription per SACCO."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id:
                  type: integer
                  description: 'The SACCO.'
                  example: 1
                subscription_type_id:
                  type: integer
                  description: 'The plan.'
                  example: 1
                starts_on:
                  type: date
                  description: 'First billing date (Y-m-d); defaults to today.'
                  example: '2026-08-01'
                  nullable: true
                is_active:
                  type: boolean
                  description: 'Whether billing is active.'
                  example: true
                  nullable: true
              required:
                - sacco_id
                - subscription_type_id
  /api/v1/auth/billing/invoices:
    get:
      summary: 'List all invoices'
      operationId: listAllInvoices
      description: 'Across every SACCO. SACCO-facing listing is in the SACCO billing group.'
      parameters:
        -
          in: query
          name: sacco_id
          description: 'Filter to one SACCO.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter to one SACCO.'
            example: 1
        -
          in: query
          name: status
          description: 'Filter by status.'
          example: overdue
          required: false
          schema:
            type: string
            description: 'Filter by status.'
            example: overdue
        -
          in: query
          name: page
          description: 'Page number (20 per page).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (20 per page).'
            example: 1
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
  /api/v1/auth/billing/invoices/generate:
    post:
      summary: 'Generate due invoices now'
      operationId: generateDueInvoicesNow
      description: 'Runs the same logic as the daily scheduler, on demand.'
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: date
                  description: 'As-of date (Y-m-d); defaults to today.'
                  example: '2026-08-01'
  '/api/v1/auth/billing/invoices/{invoice_id}/void':
    post:
      summary: 'Void an invoice'
      operationId: voidAnInvoice
      description: 'Cancels an invoice so it is no longer collectible. Idempotent.'
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
    parameters:
      -
        in: path
        name: invoice_id
        description: 'The ID of the invoice.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: invoice
        description: 'The invoice id.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/auth/billing/invoices/{invoice_id}/payments':
    post:
      summary: 'Record a manual payment'
      operationId: recordAManualPayment
      description: "For payments received outside the M-Pesa callback (bank transfer, cash, a\nreconciliation correction). Recomputes the invoice balance and status."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Amount received in KES.'
                  example: 800.0
                reference:
                  type: string
                  description: 'M-Pesa/bank reference (deduped).'
                  example: QGH12ABCD
                  nullable: true
              required:
                - amount
    parameters:
      -
        in: path
        name: invoice_id
        description: 'The ID of the invoice.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: invoice
        description: 'The invoice id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/auth/book_a_ride/queues:
    get:
      summary: 'List available trips (queues)'
      operationId: listAvailableTripsqueues
      description: "Live vehicles queued to depart, optionally narrowed to a pickup→dropoff\npair. Stops are matched by id (not name): a route qualifies only if it has\nthe pickup stop before the dropoff stop (by distance) on the same route."
      parameters:
        -
          in: query
          name: from_id
          description: 'Pickup stop (place) id.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Pickup stop (place) id.'
            example: 12
        -
          in: query
          name: to_id
          description: 'Dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Dropoff stop (place) id.'
            example: 18
        -
          in: query
          name: sacco
          description: 'Exact SACCO name to filter by.'
          example: 'Nairobi CBD SACCO'
          required: false
          schema:
            type: string
            description: 'Exact SACCO name to filter by.'
            example: 'Nairobi CBD SACCO'
        -
          in: query
          name: search
          description: 'Match vehicle plate or fleet number.'
          example: KDA
          required: false
          schema:
            type: string
            description: 'Match vehicle plate or fleet number.'
            example: KDA
        -
          in: query
          name: page
          description: 'Page number (20 per page).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (20 per page).'
            example: 1
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Book a ride'
  /api/v1/auth/book_a_ride/seats:
    get:
      summary: 'Get the seat map for a trip'
      operationId: getTheSeatMapForATrip
      description: "Returns the vehicle's seat layout plus the seats taken for the requested\npickup→dropoff. Availability is segment-aware (pick-as-you-go): pass\nfrom_id/to_id to see seats free for just that span; omit them to treat it\nas the whole trip. Uses the exact rule addBooking enforces, so a seat shown\nfree will not be rejected at confirm."
      parameters:
        -
          in: query
          name: bus_id
          description: 'The vehicle id.'
          example: 3
          required: true
          schema:
            type: integer
            description: 'The vehicle id.'
            example: 3
        -
          in: query
          name: id
          description: 'The queue (trip) id.'
          example: 7
          required: true
          schema:
            type: integer
            description: 'The queue (trip) id.'
            example: 7
        -
          in: query
          name: from_id
          description: 'Pickup stop (place) id.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Pickup stop (place) id.'
            example: 12
        -
          in: query
          name: to_id
          description: 'Dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Dropoff stop (place) id.'
            example: 18
        -
          in: query
          name: booking_id
          description: "Exclude this booking's own held seats (when amending)."
          example: 41
          required: false
          schema:
            type: integer
            description: "Exclude this booking's own held seats (when amending)."
            example: 41
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  seats:
                    seat:
                      seat_arrangements: []
                  booked:
                    -
                      seatId: 4
                properties:
                  seats:
                    type: object
                    properties:
                      seat:
                        type: object
                        properties:
                          seat_arrangements:
                            type: array
                            example: []
                  booked:
                    type: array
                    example:
                      -
                        seatId: 4
                    items:
                      type: object
                      properties:
                        seatId:
                          type: integer
                          example: 4
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bus_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                id:
                  type: integer
                  description: 'Must match an existing stored value. Must be at least 1.'
                  example: 22
                from_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 67
                  nullable: true
                to_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
                booking_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 27
                  nullable: true
              required:
                - bus_id
                - id
  /api/v1/auth/book_a_ride/fare:
    get:
      summary: 'Get the fare for a trip'
      operationId: getTheFareForATrip
      description: "Returns the SACCO-set price for a route between two stops. This value is\nauthoritative: it is exactly what the booking and the STK push will charge,\nso the app should display it and never compute its own. Served from cache,\nso it is cheap to call on every price preview."
      parameters:
        -
          in: query
          name: sacco_id
          description: 'The SACCO operating the trip (from the selected vehicle).'
          example: 1
          required: true
          schema:
            type: integer
            description: 'The SACCO operating the trip (from the selected vehicle).'
            example: 1
        -
          in: query
          name: route_id
          description: 'The route id.'
          example: 5
          required: true
          schema:
            type: integer
            description: 'The route id.'
            example: 5
        -
          in: query
          name: from_id
          description: "The pickup stop (place) id. Omit to get the route's flat fare."
          example: 12
          required: false
          schema:
            type: integer
            description: "The pickup stop (place) id. Omit to get the route's flat fare."
            example: 12
        -
          in: query
          name: to_id
          description: 'The dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'The dropoff stop (place) id.'
            example: 18
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  fare:
                    amount: 120
                    currency: KES
                    sacco_id: 1
                    route_id: 5
                    from_id: 12
                    to_id: 18
                properties:
                  fare:
                    type: object
                    properties:
                      amount:
                        type: integer
                        example: 120
                      currency:
                        type: string
                        example: KES
                      sacco_id:
                        type: integer
                        example: 1
                      route_id:
                        type: integer
                        example: 5
                      from_id:
                        type: integer
                        example: 12
                      to_id:
                        type: integer
                        example: 18
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'No fare is set for this route yet.'
                properties:
                  error:
                    type: string
                    example: 'No fare is set for this route yet.'
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                route_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                from_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 67
                  nullable: true
                to_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
              required:
                - sacco_id
                - route_id
  /api/v1/auth/book_a_ride/booking/add:
    post:
      summary: 'Create a booking (reserve seats)'
      operationId: createABookingreserveSeats
      description: "Reserves seats on a queue. The fare is resolved server-side from the SACCO's\npricing (the client's amount is ignored), the seat check + reservation run\ninside a locked transaction so two passengers can't grab the same seat, and\nthe occupancy check shares one definition with the seat map. Returns the\nserver-set `amount` to charge next."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: 'Booking successful!'
                  booking_id: 41
                  amount: 120
                properties:
                  success:
                    type: string
                    example: 'Booking successful!'
                  booking_id:
                    type: integer
                    example: 41
                  amount:
                    type: integer
                    example: 120
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'No fare is set for this route yet. Please contact the SACCO.'
                properties:
                  error:
                    type: string
                    example: 'No fare is set for this route yet. Please contact the SACCO.'
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'The queue (trip) id.'
                  example: 7
                booking_id:
                  type: integer
                  description: 'Existing booking id to amend instead of creating.'
                  example: 41
                  nullable: true
                seats:
                  type: string
                  description: 'Comma-separated seat-arrangement ids, e.g. "[3,4]".'
                  example: '[3,4]'
                name:
                  type: string
                  description: 'Passenger name.'
                  example: 'Jane Doe'
                phone:
                  type: string
                  description: 'Payer phone (10–12 digits).'
                  example: '0712345678'
                fromId:
                  type: integer
                  description: 'Pickup stop (place) id; defaults to the route origin.'
                  example: 12
                  nullable: true
                toId:
                  type: integer
                  description: 'Dropoff stop (place) id; defaults to the route destination.'
                  example: 18
                  nullable: true
                payment_method:
                  type: string
                  description: 'The chosen rail: mpesa, ncba_till, coop_till, wallet or loyalty_points.'
                  example: mpesa
                  nullable: true
              required:
                - id
                - seats
                - name
                - phone
  /api/v1/auth/mpesa/stk:
    get:
      summary: ''
      operationId: getApiV1AuthMpesaStk
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'Must be at least 9 characters. Must not be greater than 12 characters.'
                  example: bngz
                amount:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                booking_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
              required:
                - phone
                - booking_id
  /api/v1/auth/genders:
    get:
      summary: ''
      operationId: getApiV1AuthGenders
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
  /api/v1/auth/login:
    post:
      summary: ''
      operationId: postApiV1AuthLogin
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: 'This field is required when <code>email</code> is <code>=</code> or <code>null</code>.'
                  example: null
                email:
                  type: string
                  description: 'This field is required when <code>phone</code> is <code>=</code> or <code>null</code>.'
                  example: null
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - password
  /api/v1/auth/register:
    post:
      summary: ''
      operationId: postApiV1AuthRegister
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  description: ''
                  example: architecto
                lastname:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                phone:
                  type: string
                  description: 'Must be 10 digits.'
                  example: '8225697751'
                password:
                  type: string
                  description: 'Must be at least 8 characters.'
                  example: '|{+-0pBNvYgx'
                dob:
                  type: string
                  description: 'Must be a valid date. Must be a date before <code>today</code>.'
                  example: '2022-08-18'
                  nullable: true
                gender:
                  type: string
                  description: "Gender is no longer collected at sign-up. users.gender_id is nullable;\nit is still accepted if an older client sends it, but never required. Must match an existing stored value."
                  example: null
                  nullable: true
              required:
                - firstname
                - lastname
                - email
                - phone
                - password
  /api/v1/auth/register/sacco:
    post:
      summary: 'Register a SACCO'
      operationId: registerASACCO
      description: "Self-service SACCO onboarding: creates the SACCO and its first admin\naccount in one atomic step, then signs them in. The SACCO's **name** and\n**email** are the identity — no personal names are collected. The admin\nlogs in afterwards with this same email + password. Sensitive setup\n(M-Pesa credentials, billing plan, vehicles, routes) happens later inside\nthe dashboard."
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The SACCO's name (unique)."
                  example: 'Umoja SACCO'
                email:
                  type: string
                  description: 'Contact + login email (unique).'
                  example: admin@umoja.co.ke
                phone:
                  type: string
                  description: '10-digit phone number.'
                  example: '0700111222'
                password:
                  type: string
                  description: 'At least 8 characters, must be confirmed.'
                  example: secret123
                password_confirmation:
                  type: string
                  description: 'Repeat of password.'
                  example: secret123
              required:
                - name
                - email
                - phone
                - password
                - password_confirmation
      security: []
