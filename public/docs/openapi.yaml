openapi: 3.0.3
info:
  title: 'Komiut / 2Safiri Matatu API'
  description: 'REST API for the Komiut / 2Safiri matatu SACCO platform: authentication, vehicles, routes, queues, bookings, transactions, saccos, users and loyalty points.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost'
tags:
  -
    name: 'Bank partner'
    description: "\nThe list of drivers who asked for help opening an account, for the partner\nbank to work through. Authenticated by the key on the shared link (see\nBankPartnerAuth) — there is no user account behind it.\n\nRead-only by design. A partner can see who to call and export the list; it\ncannot change a driver's record, and the endpoint exposes nothing beyond the\nfields the bank needs to make contact and size the account."
  -
    name: 'Billing administration'
    description: "\nSuperadmin-only management of billing plans, SACCO subscriptions and invoice\ngeneration. Rates and assignments are controlled here; SACCOs only read their\nown billing (see the \"SACCO billing\" group)."
  -
    name: 'Book a ride'
    description: ''
  -
    name: 'Driver — queue & trip lifecycle'
    description: "\nThe driver-facing counterpart to the dispatcher's queues/add. Everything the\ndispatcher form supplies from the client — the vehicle, the fare, the queue\nstatus — is here derived server-side from the authenticated driver's active\nassignment, so a driver can only ever queue THEIR vehicle at the SACCO's own\nprice. Mirrors the C# Queue/join, Queue/exit and Trips/start-trip flow."
  -
    name: 'Driver — self-onboarding'
    description: "\nStreet sign-up. A marketing agent onboards a matatu driver in person, at the\nstage, on the agent's phone — so this is the one driver endpoint that runs\nBEFORE authentication: the driver has no account yet and their SACCO usually\nhas no account either.\n\nEverything the driver cannot answer standing beside their matatu is derived\nserver-side. In particular the partner bank comes from the brand, never the\nrequest body. There is deliberately no OTP: the driver signs in immediately\nafterwards with the phone number captured here plus the plate on the vehicle."
  -
    name: Endpoints
    description: ''
  -
    name: 'Live tracking'
    description: ''
  -
    name: Loyalty
    description: ''
  -
    name: Notifications
    description: "\nThe authenticated user's in-app notifications. Read state is server-\nauthoritative; every action is scoped to the caller (a notification id that\nisn't theirs simply isn't found).\n\nResponses are wrapped `{message:{...}}` with camelCase items to match the\napp's existing NotificationModel — migrating the app is a path change only."
  -
    name: 'Password reset (email)'
    description: "\nEmail-based password reset for dashboard accounts (SACCO admins & staff).\nStandard token flow: request a link → email → set a new password with the token.\nThe email links to the frontend reset page (App\\Notifications\\ResetPasswordLink).\nPassengers on the mobile app reset via phone/SMS instead — see /reset_password."
  -
    name: 'Payments — M-Pesa STK'
    description: "\nThe passenger app initiates an STK push, then polls this for the outcome and\ncan cancel a push the user abandoned. Status is read from local state only:\nthe confirmation webhook lands within seconds in the normal case, and the\n`payments:reconcile` poller recovers the rare lost callback — so this endpoint\nnever calls Safaricom and never writes to a booking, keeping it fast and\nincapable of the \"notification/query rolled back a paid booking\" failure mode.\n\nStatus vocabulary matches the app's model: processing | completed | failed |\ncancelled | not_found, with resultCode (0 paid, 1 failed/cancelled, null\npending) and mpesaReceiptNumber once completed."
  -
    name: Profile
    description: "\nSelf-service profile edits for the authenticated account. This is the remote\nsave the mobile edit-profile screen needs: today the app persists name and\nphone to the device only, so those changes never reach the backend.\n\nEvery field is optional — the client sends just what changed. The account is\nalways the token holder; there is no id in the body to tamper with."
  -
    name: 'QR-code fare payment'
    description: "\nPay a matatu by scanning its printed QR. The QR holds a tamper-proof SIGNED\ntoken (see QrTokenService) that encodes only the vehicle identity — never the\namount, because fares vary. Flow: the SACCO/driver generates the token\n(vehicle/{id}/token), the passenger scans and resolves it (qrcode/resolve),\nthen pays the resolved vehicle's till via the QR STK push (qrcode/stk/push)\nwith a passenger-entered amount."
  -
    name: 'Roles & permissions'
    description: "\nThe dashboard renders per-permission — the login response already returns the\nsigned-in user's `permissions`, and the UI shows/hides modules off that.\n\nRoles are global (no per-SACCO custom roles yet), so **role CRUD is\nsuperadmin-only**: a created role would otherwise be visible to every SACCO.\nSACCO admins get an **assign-only** surface — they may place their own staff\non the shared SACCO-tier roles, and only on roles whose permissions they\nthemselves hold."
  -
    name: 'SACCO billing'
    description: "\nA SACCO's own subscription and invoices. Every read is SACCO-scoped\nautomatically (a SACCO can never see another SACCO's billing); superadmins\nsee across SACCOs and may target one with `sacco_id`. Invoices are settled by\npaying the `invoice_number` as the M-Pesa account reference to the billing\npaybill — management (rates, generation) lives in the superadmin billing API."
  -
    name: 'SACCO directory'
    description: "\nA public type-ahead over the SACCO directory, used while a driver is being\nonboarded — before they have a token, and usually before their SACCO has an\naccount at all.\n\nThe response is shaped by hand to id + name. Directory rows carry the SACCO's\nown contact details, and this endpoint is unauthenticated, so serialising the\nmodel (as the dashboard's saccos endpoint does) would publish them."
  -
    name: 'SACCO fares'
    description: "\nSACCOs price their own routes. A fare is per pickup→dropoff pair; where no\npair is set, the flat `sacco_routes.amount` applies. Editing here invalidates\nthe fare cache so the new price is live immediately."
  -
    name: 'SACCO loyalty'
    description: "\nA SACCO configures its own loyalty program: the earn divisor (KES per point)\nand the points needed for a free ride."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a bearer token from the <code>POST api/login</code> or <code>POST api/register</code> endpoints. All requests must also send the <code>X-App-Key</code> brand header.'
security:
  -
    default: []
paths:
  /api/v1/partner/bank/leads:
    get:
      summary: 'List driver leads'
      operationId: listDriverLeads
      description: "Paginated, newest first, scoped to the partner's own brand. Optional\n`status` filter and `q` search over driver name/phone."
      parameters:
        -
          in: query
          name: status
          description: 'Filter by lead status.'
          example: new
          required: false
          schema:
            type: string
            description: 'Filter by lead status.'
            example: new
        -
          in: query
          name: q
          description: 'Search driver name or phone.'
          example: '0712'
          required: false
          schema:
            type: string
            description: 'Search driver name or phone.'
            example: '0712'
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  partner: 'NCBA Bank'
                  total: 1
                  leads:
                    -
                      name: 'John Mwangi'
                      phone: '0712345678'
                      email: null
                      sacco: 'Nicco SACCO'
                      preferred_branch: Westlands
                      vehicle_seats: 14
                      status: new
                      opted_in_at: '2026-07-27T10:00:00Z'
                properties:
                  partner:
                    type: string
                    example: 'NCBA Bank'
                  total:
                    type: integer
                    example: 1
                  leads:
                    type: array
                    example:
                      -
                        name: 'John Mwangi'
                        phone: '0712345678'
                        email: null
                        sacco: 'Nicco SACCO'
                        preferred_branch: Westlands
                        vehicle_seats: 14
                        status: new
                        opted_in_at: '2026-07-27T10:00:00Z'
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: 'John Mwangi'
                        phone:
                          type: string
                          example: '0712345678'
                        email:
                          type: string
                          example: null
                          nullable: true
                        sacco:
                          type: string
                          example: 'Nicco SACCO'
                        preferred_branch:
                          type: string
                          example: Westlands
                        vehicle_seats:
                          type: integer
                          example: 14
                        status:
                          type: string
                          example: new
                        opted_in_at:
                          type: string
                          example: '2026-07-27T10:00:00Z'
      tags:
        - 'Bank partner'
      security: []
  /api/v1/partner/bank/leads/export:
    get:
      summary: 'Export leads as CSV'
      operationId: exportLeadsAsCSV
      description: "The same rows as the list, streamed as a spreadsheet the bank can work\nfrom directly. Streamed rather than built in memory so a long list does\nnot have to fit in one response buffer."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'A partner key is required.'
                properties:
                  error:
                    type: string
                    example: 'A partner key is required.'
      tags:
        - 'Bank partner'
      security: []
  /api/v1/auth/billing/plans:
    get:
      summary: 'List billing plans'
      operationId: listBillingPlans
      description: ''
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
  /api/v1/auth/billing/plans/save:
    post:
      summary: 'Create or update a billing plan'
      operationId: createOrUpdateABillingPlan
      description: "Pass `id` to update an existing plan, omit it to create one. Invoice for a\nperiod = base_fee + per_vehicle_fee × active vehicles (capped at vehicle_cap)."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'Plan id to update; omit to create.'
                  example: 1
                  nullable: true
                name:
                  type: string
                  description: 'Plan name.'
                  example: Standard
                description:
                  type: string
                  description: 'Short description.'
                  example: 'Up to 50 vehicles'
                  nullable: true
                billing_cycle:
                  type: string
                  description: 'monthly, quarterly or annually.'
                  example: monthly
                base_fee:
                  type: number
                  description: 'Flat fee per period in KES.'
                  example: 500.0
                  nullable: true
                per_vehicle_fee:
                  type: number
                  description: 'Fee per active vehicle in KES.'
                  example: 100.0
                  nullable: true
                vehicle_cap:
                  type: integer
                  description: 'Stop charging past this many vehicles.'
                  example: 50
                  nullable: true
                currency:
                  type: string
                  description: '3-letter currency code.'
                  example: KES
                  nullable: true
                is_active:
                  type: boolean
                  description: 'Whether the plan can be assigned.'
                  example: true
                  nullable: true
              required:
                - name
                - billing_cycle
  /api/v1/auth/billing/subscriptions/assign:
    post:
      summary: 'Assign a SACCO to a plan'
      operationId: assignASACCOToAPlan
      description: "Creates or updates the SACCO's subscription and sets the first billing\ndate (defaults to today). One subscription per SACCO."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id:
                  type: integer
                  description: 'The SACCO.'
                  example: 1
                subscription_type_id:
                  type: integer
                  description: 'The plan.'
                  example: 1
                starts_on:
                  type: date
                  description: 'First billing date (Y-m-d); defaults to today.'
                  example: '2026-08-01'
                  nullable: true
                is_active:
                  type: boolean
                  description: 'Whether billing is active.'
                  example: true
                  nullable: true
              required:
                - sacco_id
                - subscription_type_id
  /api/v1/auth/billing/invoices:
    get:
      summary: 'List all invoices'
      operationId: listAllInvoices
      description: 'Across every SACCO. SACCO-facing listing is in the SACCO billing group.'
      parameters:
        -
          in: query
          name: sacco_id
          description: 'Filter to one SACCO.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Filter to one SACCO.'
            example: 1
        -
          in: query
          name: status
          description: 'Filter by status.'
          example: overdue
          required: false
          schema:
            type: string
            description: 'Filter by status.'
            example: overdue
        -
          in: query
          name: page
          description: 'Page number (20 per page).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (20 per page).'
            example: 1
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
  /api/v1/auth/billing/invoices/generate:
    post:
      summary: 'Generate due invoices now'
      operationId: generateDueInvoicesNow
      description: 'Runs the same logic as the daily scheduler, on demand.'
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: date
                  description: 'As-of date (Y-m-d); defaults to today.'
                  example: '2026-08-01'
  '/api/v1/auth/billing/invoices/{invoice_id}/void':
    post:
      summary: 'Void an invoice'
      operationId: voidAnInvoice
      description: 'Cancels an invoice so it is no longer collectible. Idempotent.'
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
    parameters:
      -
        in: path
        name: invoice_id
        description: 'The ID of the invoice.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: invoice
        description: 'The invoice id.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/auth/billing/invoices/{invoice_id}/payments':
    post:
      summary: 'Record a manual payment'
      operationId: recordAManualPayment
      description: "For payments received outside the M-Pesa callback (bank transfer, cash, a\nreconciliation correction). Recomputes the invoice balance and status."
      parameters: []
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Billing administration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Amount received in KES.'
                  example: 800.0
                reference:
                  type: string
                  description: 'M-Pesa/bank reference (deduped).'
                  example: QGH12ABCD
                  nullable: true
              required:
                - amount
    parameters:
      -
        in: path
        name: invoice_id
        description: 'The ID of the invoice.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: invoice
        description: 'The invoice id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/auth/book_a_ride/queues:
    get:
      summary: 'List available trips (queues)'
      operationId: listAvailableTripsqueues
      description: "Live vehicles queued to depart, optionally narrowed to a pickup→dropoff\npair. Stops are matched by id (not name): a route qualifies only if it has\nthe pickup stop before the dropoff stop (by distance) on the same route."
      parameters:
        -
          in: query
          name: from_id
          description: 'Pickup stop (place) id.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Pickup stop (place) id.'
            example: 12
        -
          in: query
          name: to_id
          description: 'Dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Dropoff stop (place) id.'
            example: 18
        -
          in: query
          name: sacco
          description: 'Exact SACCO name to filter by.'
          example: 'Nairobi CBD SACCO'
          required: false
          schema:
            type: string
            description: 'Exact SACCO name to filter by.'
            example: 'Nairobi CBD SACCO'
        -
          in: query
          name: search
          description: 'Match vehicle plate or fleet number.'
          example: KDA
          required: false
          schema:
            type: string
            description: 'Match vehicle plate or fleet number.'
            example: KDA
        -
          in: query
          name: page
          description: 'Page number (20 per page).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (20 per page).'
            example: 1
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - 'Book a ride'
  /api/v1/auth/book_a_ride/seats:
    get:
      summary: 'Get the seat map for a trip'
      operationId: getTheSeatMapForATrip
      description: "Returns the vehicle's seat layout plus the seats taken for the requested\npickup→dropoff. Availability is segment-aware (pick-as-you-go): pass\nfrom_id/to_id to see seats free for just that span; omit them to treat it\nas the whole trip. Uses the exact rule addBooking enforces, so a seat shown\nfree will not be rejected at confirm."
      parameters:
        -
          in: query
          name: bus_id
          description: 'The vehicle id.'
          example: 3
          required: true
          schema:
            type: integer
            description: 'The vehicle id.'
            example: 3
        -
          in: query
          name: id
          description: 'The queue (trip) id.'
          example: 7
          required: true
          schema:
            type: integer
            description: 'The queue (trip) id.'
            example: 7
        -
          in: query
          name: from_id
          description: 'Pickup stop (place) id.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Pickup stop (place) id.'
            example: 12
        -
          in: query
          name: to_id
          description: 'Dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Dropoff stop (place) id.'
            example: 18
        -
          in: query
          name: booking_id
          description: "Exclude this booking's own held seats (when amending)."
          example: 41
          required: false
          schema:
            type: integer
            description: "Exclude this booking's own held seats (when amending)."
            example: 41
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  seats:
                    seat:
                      seat_arrangements: []
                  booked:
                    -
                      seatId: 4
                properties:
                  seats:
                    type: object
                    properties:
                      seat:
                        type: object
                        properties:
                          seat_arrangements:
                            type: array
                            example: []
                  booked:
                    type: array
                    example:
                      -
                        seatId: 4
                    items:
                      type: object
                      properties:
                        seatId:
                          type: integer
                          example: 4
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bus_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                id:
                  type: integer
                  description: 'Must match an existing stored value. Must be at least 1.'
                  example: 22
                from_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 67
                  nullable: true
                to_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
                booking_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 27
                  nullable: true
              required:
                - bus_id
                - id
  /api/v1/auth/book_a_ride/fare:
    get:
      summary: 'Get the fare for a trip'
      operationId: getTheFareForATrip
      description: "Returns the SACCO-set price for a route between two stops. This value is\nauthoritative: it is exactly what the booking and the STK push will charge,\nso the app should display it and never compute its own. Served from cache,\nso it is cheap to call on every price preview."
      parameters:
        -
          in: query
          name: sacco_id
          description: 'The SACCO operating the trip (from the selected vehicle).'
          example: 1
          required: true
          schema:
            type: integer
            description: 'The SACCO operating the trip (from the selected vehicle).'
            example: 1
        -
          in: query
          name: route_id
          description: 'The route id.'
          example: 5
          required: true
          schema:
            type: integer
            description: 'The route id.'
            example: 5
        -
          in: query
          name: from_id
          description: "The pickup stop (place) id. Omit to get the route's flat fare."
          example: 12
          required: false
          schema:
            type: integer
            description: "The pickup stop (place) id. Omit to get the route's flat fare."
            example: 12
        -
          in: query
          name: to_id
          description: 'The dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'The dropoff stop (place) id.'
            example: 18
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  fare:
                    amount: 120
                    currency: KES
                    sacco_id: 1
                    route_id: 5
                    from_id: 12
                    to_id: 18
                properties:
                  fare:
                    type: object
                    properties:
                      amount:
                        type: integer
                        example: 120
                      currency:
                        type: string
                        example: KES
                      sacco_id:
                        type: integer
                        example: 1
                      route_id:
                        type: integer
                        example: 5
                      from_id:
                        type: integer
                        example: 12
                      to_id:
                        type: integer
                        example: 18
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'No fare is set for this route yet.'
                properties:
                  error:
                    type: string
                    example: 'No fare is set for this route yet.'
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sacco_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                route_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                from_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 67
                  nullable: true
                to_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
              required:
                - sacco_id
                - route_id
  /api/v1/auth/book_a_ride/booking/add:
    post:
      summary: 'Create a booking (reserve seats)'
      operationId: createABookingreserveSeats
      description: "Reserves seats on a queue. The fare is resolved server-side from the SACCO's\npricing (the client's amount is ignored), the seat check + reservation run\ninside a locked transaction so two passengers can't grab the same seat, and\nthe occupancy check shares one definition with the seat map. Returns the\nserver-set `amount` to charge next."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: 'Booking successful!'
                  booking_id: 41
                  amount: 120
                properties:
                  success:
                    type: string
                    example: 'Booking successful!'
                  booking_id:
                    type: integer
                    example: 41
                  amount:
                    type: integer
                    example: 120
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'No fare is set for this route yet. Please contact the SACCO.'
                properties:
                  error:
                    type: string
                    example: 'No fare is set for this route yet. Please contact the SACCO.'
      tags:
        - 'Book a ride'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: 'The queue (trip) id.'
                  example: 7
                booking_id:
                  type: integer
                  description: 'Existing booking id to amend instead of creating.'
                  example: 41
                  nullable: true
                seats:
                  type: string
                  description: 'Comma-separated seat-arrangement ids, e.g. "[3,4]".'
                  example: '[3,4]'
                name:
                  type: string
                  description: 'Passenger name.'
                  example: 'Jane Doe'
                phone:
                  type: string
                  description: 'Payer phone (10–12 digits).'
                  example: '0712345678'
                fromId:
                  type: integer
                  description: 'Pickup stop (place) id; defaults to the route origin.'
                  example: 12
                  nullable: true
                toId:
                  type: integer
                  description: 'Dropoff stop (place) id; defaults to the route destination.'
                  example: 18
                  nullable: true
                payment_method:
                  type: string
                  description: 'The chosen rail: mpesa, ncba_till, coop_till, wallet or loyalty_points.'
                  example: mpesa
                  nullable: true
              required:
                - id
                - seats
                - name
                - phone
  /api/v1/auth/queues/join:
    post:
      summary: 'Join a queue'
      operationId: joinAQueue
      description: "The driver queues the vehicle they are assigned to today at a terminus for\na route. The vehicle comes from the driver's active assignment (never the\nbody), the fare from the SACCO's route pricing, and the status is Pending —\nthe client sends only where it is going. Re-joining while already queued on\nthe same route returns the existing queue."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  queue:
                    id: 12
                    queue_number: QN-1
                    queue_status_id: 1
                    amount: 120
                properties:
                  queue:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      queue_number:
                        type: string
                        example: QN-1
                      queue_status_id:
                        type: integer
                        example: 1
                      amount:
                        type: integer
                        example: 120
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'This vehicle is already queued on another route.'
                properties:
                  error:
                    type: string
                    example: 'This vehicle is already queued on another route.'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Terminus is not the start of this route.'
                properties:
                  error:
                    type: string
                    example: 'Terminus is not the start of this route.'
      tags:
        - 'Driver — queue & trip lifecycle'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                terminus_id:
                  type: integer
                  description: 'The terminus the vehicle is queuing at.'
                  example: 3
                route_id:
                  type: integer
                  description: 'The route being served.'
                  example: 5
              required:
                - terminus_id
                - route_id
  /api/v1/auth/queues/exit:
    post:
      summary: 'Exit the current queue'
      operationId: exitTheCurrentQueue
      description: "Cancels the driver's own active/pending queue (they pulled out before\ndeparting). A queue already Completed or Cancelled is left untouched."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: 'Left the queue.'
                properties:
                  success:
                    type: string
                    example: 'Left the queue.'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'You are not currently queued.'
                properties:
                  error:
                    type: string
                    example: 'You are not currently queued.'
      tags:
        - 'Driver — queue & trip lifecycle'
  /api/v1/auth/trips/start:
    post:
      summary: 'Start the trip'
      operationId: startTheTrip
      description: "Moves the driver's Pending queue to Active and stamps the start time — the\nserver-owned transition the app calls when the vehicle departs. Idempotent:\na queue already Active is returned as-is."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  queue:
                    id: 12
                    queue_status_id: 2
                    start_time: '2026-07-25T08:00:00Z'
                properties:
                  queue:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      queue_status_id:
                        type: integer
                        example: 2
                      start_time:
                        type: string
                        example: '2026-07-25T08:00:00Z'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'You are not currently queued.'
                properties:
                  error:
                    type: string
                    example: 'You are not currently queued.'
      tags:
        - 'Driver — queue & trip lifecycle'
  /api/v1/auth/trips/bookings:
    get:
      summary: 'Bookings on the current trip'
      operationId: bookingsOnTheCurrentTrip
      description: "The passengers booked on the driver's live (Pending/Active) queue, in the\nshape the driver Bookings page reads: passenger name/phone, selected\npickup/dropoff points, and a bookingType discriminator. Empty when the\ndriver is not queued."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  bookings:
                    -
                      bookingId: 1
                      passengerName: Wanjiku
                      passengerPhone: 2547...
                      bookingType: route
                      pickup:
                        id: 12
                        name: CBD
                      dropoff:
                        id: 18
                        name: Thika
                properties:
                  bookings:
                    type: array
                    example:
                      -
                        bookingId: 1
                        passengerName: Wanjiku
                        passengerPhone: 2547...
                        bookingType: route
                        pickup:
                          id: 12
                          name: CBD
                        dropoff:
                          id: 18
                          name: Thika
                    items:
                      type: object
                      properties:
                        bookingId:
                          type: integer
                          example: 1
                        passengerName:
                          type: string
                          example: Wanjiku
                        passengerPhone:
                          type: string
                          example: 2547...
                        bookingType:
                          type: string
                          example: route
                        pickup:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 12
                            name:
                              type: string
                              example: CBD
                        dropoff:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 18
                            name:
                              type: string
                              example: Thika
      tags:
        - 'Driver — queue & trip lifecycle'
  /api/v1/auth/driver/onboard:
    post:
      summary: 'Onboard a driver'
      operationId: onboardADriver
      description: "Creates the driver's account, registers the vehicle if the SACCO never\nhas, and opens the driver↔vehicle assignment they will log in against.\nSubmitting a `sacco_name` we have not seen adds it to the SACCO directory\nfor review rather than rejecting it — the SACCO is signed up later.\n\nRe-onboarding a phone we already know updates that driver and moves them\nto the new vehicle; it never creates a second account."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  driver:
                    id: 9
                    firstname: Peter
                    lastname: Kamau
                    phone: '0722000111'
                    type: driver
                  sacco:
                    id: 4
                    name: 'Nicco SACCO'
                  vehicle:
                    id: 12
                    plate: KDQ446R
                  next_step: 'Sign in with this phone number and number plate. No password needed.'
                properties:
                  driver:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 9
                      firstname:
                        type: string
                        example: Peter
                      lastname:
                        type: string
                        example: Kamau
                      phone:
                        type: string
                        example: '0722000111'
                      type:
                        type: string
                        example: driver
                  sacco:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      name:
                        type: string
                        example: 'Nicco SACCO'
                  vehicle:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 12
                      plate:
                        type: string
                        example: KDQ446R
                  next_step:
                    type: string
                    example: 'Sign in with this phone number and number plate. No password needed.'
        400:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    phone:
                      - 'The phone field must be 10 digits.'
                properties:
                  errors:
                    type: object
                    properties:
                      phone:
                        type: array
                        example:
                          - 'The phone field must be 10 digits.'
                        items:
                          type: string
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'The number plate KDQ446R is already registered.'
                properties:
                  error:
                    type: string
                    example: 'The number plate KDQ446R is already registered.'
      tags:
        - 'Driver — self-onboarding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                  description: "The driver's first name."
                  example: Peter
                lastname:
                  type: string
                  description: "The driver's surname."
                  example: Kamau
                phone:
                  type: string
                  description: '10-digit phone number; this is how they sign in.'
                  example: '0722000111'
                email:
                  type: string
                  description: 'Optional email address.'
                  example: peter@example.com
                  nullable: true
                id_number:
                  type: string
                  description: 'National ID number.'
                  example: '24567890'
                sacco_id:
                  type: integer
                  description: 'The SACCO picked from saccos/directory. Required without sacco_name.'
                  example: 4
                  nullable: true
                sacco_name:
                  type: string
                  description: 'The SACCO typed in when it is not in the directory. Required without sacco_id.'
                  example: 'Nicco SACCO'
                  nullable: true
                plate:
                  type: string
                  description: "The vehicle's number plate; this is the other half of their login."
                  example: KDQ446R
                vehicle_capacity:
                  type: integer
                  description: 'Seat count of the matatu.'
                  example: 14
                  nullable: true
                bank_opt_in:
                  type: boolean
                  description: 'Whether the driver wants a partner bank account.'
                  example: true
                preferred_branch:
                  type: string
                  description: 'Branch the driver would use. Required when bank_opt_in is true.'
                  example: 'Thika Road'
                  nullable: true
              required:
                - firstname
                - lastname
                - phone
                - id_number
                - plate
      security: []
