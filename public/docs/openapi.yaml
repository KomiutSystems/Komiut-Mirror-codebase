      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - 'QR-code fare payment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehicle_id:
                  type: integer
                  description: 'required_without:qr_token The vehicle id (legacy).'
                  example: 1
                amount:
                  type: integer
                  description: 'Amount in KES the passenger pays.'
                  example: 120
                phone:
                  type: string
                  description: '10-digit M-Pesa phone.'
                  example: '0700111222'
                seat_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                user_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                qr_token:
                  type: string
                  description: 'The signed token from a scanned QR (preferred).'
