                queue_id:
                  type: integer
                  description: 'The trip (queue) id.'
                  example: 7
              required:
                - queue_id
  /api/v1/auth/book_a_ride/nearby:
    get:
      summary: 'Live vehicles near me'
      operationId: liveVehiclesNearMe
      description: "Returns broadcasting vehicles within radius (km) of a point — freshest and\nnearest first — for the \"matatus approaching my stop\" map. Optionally\nconstrained to a route."
      parameters:
        -
          in: query
          name: latitude
          description: 'Your latitude.'
          example: -1.2921
          required: true
          schema:
            type: number
            description: 'Your latitude.'
            example: -1.2921
        -
          in: query
          name: longitude
          description: 'Your longitude.'
          example: 36.8219
          required: true
          schema:
            type: number
            description: 'Your longitude.'
            example: 36.8219
        -
          in: query
          name: radius
          description: 'Search radius in km (default 5).'
          example: 3.0
          required: false
          schema:
            type: number
            description: 'Search radius in km (default 5).'
            example: 3.0
        -
          in: query
          name: route_id
          description: 'Only vehicles on this route.'
          example: 5
          required: false
          schema:
            type: integer
            description: 'Only vehicles on this route.'
            example: 5
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  vehicles:
                    -
                      vehicle_id: 3
                      plate: KDA001A
                      capacity: 14
                      latitude: -1.29
                      longitude: 36.82
                      heading: 74
                      distance_km: 0.4
                properties:
                  vehicles:
                    type: array
                    example:
                      -
                        vehicle_id: 3
                        plate: KDA001A
                        capacity: 14
                        latitude: -1.29
                        longitude: 36.82
                        heading: 74
                        distance_km: 0.4
                    items:
                      type: object
                      properties:
                        vehicle_id:
                          type: integer
                          example: 3
                        plate:
                          type: string
                          example: KDA001A
                        capacity:
                          type: integer
                          example: 14
                        latitude:
                          type: number
                          example: -1.29
                        longitude:
                          type: number
                          example: 36.82
                        heading:
                          type: integer
                          example: 74
                        distance_km:
                          type: number
                          example: 0.4
      tags:
        - 'Live tracking'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  description: 'Must be between -90 and 90.'
                  example: -89
                longitude:
                  type: number
                  description: 'Must be between -180 and 180.'
                  example: -179
                radius:
                  type: number
                  description: 'Must be at least 0.1. Must not be greater than 50.'
                  example: 7
                  nullable: true
                route_id:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
              required:
                - latitude
                - longitude
