  '/api/v1/auth/qrcode/vehicle/{vehicle_id}/token':
    get:
      summary: "Generate a vehicle's fare QR token"
      operationId: generateAVehiclesFareQRToken
      description: "Returns a tamper-proof signed token for the vehicle; the dashboard/app\nrenders a QR from it and displays it in the matatu. Never expires; encodes\nonly the vehicle identity, never an amount."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  token: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
                  vehicle:
                    id: 1
                    plate: KDA123X
                    till_number: '5202020'
                properties:
                  token:
                    type: string
                    example: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
                  vehicle:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      plate:
                        type: string
                        example: KDA123X
                      till_number:
                        type: string
                        example: '5202020'
      tags:
        - 'QR-code fare payment'
    parameters:
      -
        in: path
        name: vehicle_id
        description: 'The ID of the vehicle.'
        example: 16
        required: true
        schema:
          type: integer
      -
        in: path
        name: vehicle
        description: 'The vehicle id.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/auth/qrcode/resolve:
    post:
      summary: 'Resolve a scanned fare QR'
      operationId: resolveAScannedFareQR
      description: "Validates the signed token from a scanned QR and returns the vehicle to\npay (plate + till + SACCO). Tampered/forged tokens are rejected. The amount\nis not in the QR — the passenger enters it, then calls the QR STK push."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  vehicle:
                    id: 1
                    plate: KDA123X
                    till_number: '5202020'
                    sacco:
                      id: 2
                      name: 'Umoja SACCO'
                properties:
                  vehicle:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      plate:
                        type: string
                        example: KDA123X
                      till_number:
                        type: string
                        example: '5202020'
                      sacco:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          name:
                            type: string
                            example: 'Umoja SACCO'
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: 'Invalid or tampered QR code'
                properties:
                  error:
                    type: string
                    example: 'Invalid or tampered QR code'
      tags:
        - 'QR-code fare payment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'The scanned QR token.'
                  example: eyJ2ZWhpY2xlX2lkIjoxfQ.f3a9...
              required:
                - token
