  /api/v1/auth/book_a_ride/routes:
    get:
      summary: 'Search routes by pickup & dropoff'
      operationId: searchRoutesByPickupDropoff
      description: "Point-first (\"Uber with fixed stops\"): the passenger picks a pickup and a\ndropoff point and we return the routes that serve that segment — a route\nmatches when both points are stops on it and the pickup comes before the\ndropoff (pickup.distance < dropoff.distance). Prefer the id-based\n`from_place_id`/`to_place_id`; the name form is a legacy fallback.\nWith no pickup/dropoff, returns all active routes."
      parameters:
        -
          in: query
          name: from_place_id
          description: 'Pickup stop (place) id.'
          example: 12
          required: false
          schema:
            type: integer
            description: 'Pickup stop (place) id.'
            example: 12
        -
          in: query
          name: to_place_id
          description: 'Dropoff stop (place) id.'
          example: 18
          required: false
          schema:
            type: integer
            description: 'Dropoff stop (place) id.'
            example: 18
        -
          in: query
          name: from
          description: 'Legacy: pickup place name (exact).'
          example: 'Nairobi CBD'
          required: false
          schema:
            type: string
            description: 'Legacy: pickup place name (exact).'
            example: 'Nairobi CBD'
        -
          in: query
          name: to
          description: 'Legacy: dropoff place name (exact).'
          example: Thika
          required: false
          schema:
            type: string
            description: 'Legacy: dropoff place name (exact).'
            example: Thika
        -
          in: query
          name: page
          description: 'Page number (20 per page).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number (20 per page).'
            example: 1
      responses:
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Server Error'
                properties:
                  message:
                    type: string
                    example: 'Server Error'
      tags:
        - Endpoints
