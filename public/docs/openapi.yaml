                      -
                        id: 41
                        name: Wanjiku
                        paid: true
                        seats:
                          - 4
                        pickup:
                          id: 12
                          name: Ruiru
                        dropoff:
                          id: 18
                          name: Thika
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 41
                        name:
                          type: string
                          example: Wanjiku
