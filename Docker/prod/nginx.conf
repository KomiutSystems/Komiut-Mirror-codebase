# nginx in front of php-fpm. Serves both brand domains to the SAME app — brand is
# resolved per request from the Host header. TLS terminates at the ALB, which
# talks to port 80 here.
#
# Two server blocks, chosen by Host:
#
#   1. The brand APEXES (komiut.com, 2safiri.co.ke, and www) are the dashboard.
#      /api, /docs and /up go to php-fpm as on every host; everything else is
#      proxied to the dashboard (Next.js on App Runner, reached as
#      app.komiut.com / app.2safiri.co.ke). The dashboard calls the API with
#      RELATIVE paths, so on the apex its own /api calls come straight back
#      here -- one hostname, one origin, no CORS.
#
#      /api must stay on php on the apex: NCBA posts its webhook to
#      komiut.com/api/rest/mpesa/confirmation_new and the current driver app
#      calls komiut.com/api/auth/... Neither can be told a new URL quickly.
#
#      App Runner routes by Host and terminates TLS for its associated domains,
#      so the upstream request carries Host = the app.* domain and SNI to
#      match; the visitor's own host travels in X-Forwarded-Host. Resolved
#      through Docker's DNS with a short TTL because App Runner's addresses are
#      not fixed.
#
#   2. Every other host (api.*, payments.*, bankpayments.*, the brand app_keys'
#      hosts) is the API, exactly as before.

# Compress responses (this file is included in the http block, where the stock
# nginx.conf leaves gzip off). The polled JSON feeds were 17-30 KB each, sent
# raw to phones on mobile data; they shrink 7-10x. The M-Pesa and bank acks
# (~53 bytes) are under gzip_min_length and go out exactly as before -- which
# relies on App\Http\Middleware\SetContentLength: nginx reads the length only
# from a Content-Length header, and php-fpm sends none. Bodies are
# byte-identical after decompression; auth is a bearer header, not a cookie,
# so BREACH-style guessing has nothing to aim at.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 4;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

map $host $dashboard_upstream_host {
    default             "";
    komiut.com          app.komiut.com;
    www.komiut.com      app.komiut.com;
    2safiri.co.ke       app.2safiri.co.ke;
    www.2safiri.co.ke   app.2safiri.co.ke;
}

server {
    listen 80;
    server_name komiut.com www.komiut.com 2safiri.co.ke www.2safiri.co.ke;

    root /var/www/public;
    index index.php index.html;
    # Matches PHP's post_max_size (8M). The largest upload is a 2 MB profile
    # picture; a body PHP would refuse anyway should not reach it at all
    # (CVE-2026-109618 hardening). Applies to chunked bodies too.
    client_max_body_size 8M;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $dashboard_origin ew8edm4hsf.eu-central-1.awsapprunner.com;

    # The ALB health probe: php-fpm's own [health] pool on :9001 (Dockerfile),
    # never the main pool, so a server busy with slow requests still answers
    # and is not replaced for being busy. Exact match, so it wins over the
    # regex locations below.
    location = /api/up {
        fastcgi_pass app:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 10s;
    }

    # The API, the docs and the health probe: php, never the dashboard.
    location ~ ^/(api|docs|up)(/|$) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Reverb websocket path, in case the dashboard opens it relatively.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else: the dashboard.
    location / {
        proxy_pass https://$dashboard_origin$request_uri;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $dashboard_upstream_host;
        proxy_set_header Host $dashboard_upstream_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80 default_server;
    server_name komiut.co.ke www.komiut.co.ke;

    root /var/www/public;
    index index.php index.html;   # index.html so /docs/ serves the Scribe page
    # Matches PHP's post_max_size (8M). The largest upload is a 2 MB profile
    # picture; a body PHP would refuse anyway should not reach it at all
    # (CVE-2026-109618 hardening). Applies to chunked bodies too.
    client_max_body_size 8M;

    # The ALB health probe: php-fpm's own [health] pool on :9001 (Dockerfile),
    # never the main pool, so a server busy with slow requests still answers
    # and is not replaced for being busy. Exact match, so it wins over the
    # regex locations below.
    location = /api/up {
        fastcgi_pass app:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Reverb websocket path (live vehicle tracking, Pusher protocol).
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
