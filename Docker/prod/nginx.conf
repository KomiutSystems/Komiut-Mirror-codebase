# nginx in front of php-fpm. Serves both brand domains to the SAME app — brand is
# resolved per request from the Host header. TLS certs are mounted at /etc/nginx/certs
# (issue with certbot or AWS ACM on the ALB; if you terminate TLS at an ALB instead,
# drop the 443 server and let the ALB talk to port 80).

server {
    listen 80;
    server_name komiut.co.ke www.komiut.co.ke 2safiri.co.ke www.2safiri.co.ke;

    root /var/www/public;
    index index.php index.html;   # index.html so /docs/ serves the Scribe page
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Reverb websocket path (live vehicle tracking, Pusher protocol).
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
