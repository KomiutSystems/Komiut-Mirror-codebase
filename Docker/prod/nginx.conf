# nginx in front of php-fpm. Serves both brand domains to the SAME app — brand is
# resolved per request from the Host header. TLS certs are mounted at /etc/nginx/certs
# (issue with certbot or AWS ACM on the ALB; if you terminate TLS at an ALB instead,
# drop the 443 server and let the ALB talk to port 80).

server {
    listen 80;
    server_name komiut.co.ke www.komiut.co.ke 2safiri.co.ke www.2safiri.co.ke;

    root /var/www/public;
    index index.php;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
