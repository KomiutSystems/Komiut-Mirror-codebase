# Staging nginx — catch-all server_name so it answers on the bare EC2 IP or any
# staging hostname. Brand is resolved by the app (X-App-Key header / Host), so
# one server block serves both brands.
# Docker's embedded DNS. Resolving the `app` upstream through it at REQUEST time
# (via the $upstream variable below) means nginx picks up the app container's new
# IP after every `compose up --build` recreation — a literal `fastcgi_pass app:9000`
# caches the IP at startup and 502s once the app container is replaced.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
