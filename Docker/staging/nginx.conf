# Staging nginx — catch-all server_name so it answers on the bare EC2 IP or any
# staging hostname. Brand is resolved by the app (X-App-Key header / Host), so
# one server block serves both brands.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
